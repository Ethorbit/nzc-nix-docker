name: Test changed projects

on:
  pull_request:
  push:
    branches: [workflow]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Find changed projects
        id: changed
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          CHANGED=$(git diff --name-only "$BASE" HEAD -- projects/ \
            | cut -d/ -f2 | sort -u)
          echo "projects<<EOF" >> "$GITHUB_OUTPUT"
          echo "$CHANGED" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Run tests for changed projects
        run: |
          while IFS= read -r proj; do
            [ -z "$proj" ] && continue
            if [ -f "projects/$proj/test.nix" ]; then
              echo "::group::Testing $proj"
              nix run ".#$proj" -- up -d
              sleep 5
              nix run ".#$proj" -- down
              echo "::endgroup::"
            fi
          done <<< "${{ steps.changed.outputs.projects }}"
